name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  web:
    name: Web Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        # 与 indunexus-web/.nvmrc、package.json 中 @types/node 主版本一致（Vite 8 需 Node ≥20.19）
        node-version-file: indunexus-web/.nvmrc
        cache: 'npm'
        cache-dependency-path: indunexus-web/package-lock.json
    
    - name: Install dependencies
      working-directory: ./indunexus-web
      run: npm ci
    
    - name: Build
      working-directory: ./indunexus-web
      run: npm run build

  api:
    name: API Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version-file: indunexus-api/.python-version
        cache: 'pip'
        cache-dependency-path: indunexus-api/requirements.txt
    
    - name: Install dependencies
      working-directory: ./indunexus-api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
